apply plugin: 'java'

repositories {
    maven {
        url 'https://dxfeed.jfrog.io/artifactory/maven-open'
    }
}

def native_version = '2.2.1'
def name = 'graal-native-sdk'
dependencies {
    implementation(group: 'com.dxfeed', name: "${name}", version: "${native_version}", classifier: 'aarch64-osx', ext: 'zip')
    implementation(group: 'com.dxfeed', name: "${name}", version: "${native_version}", classifier: 'x86_64-osx', ext: 'zip')
    implementation(group: 'com.dxfeed', name: "${name}", version: "${native_version}", classifier: 'aarch64-ios', ext: 'zip')
    implementation(group: 'com.dxfeed', name: "${name}", version: "${native_version}", classifier: 'ios-simulator', ext: 'zip')
}

task fetchDependencies(type: Copy) {
    outputs.upToDateWhen { false }

    doFirst {
        new File('downloads').mkdirs()
        new File('graal_builds').deleteDir()
        println "Downloaded dep:"
        sourceSets.main.runtimeClasspath.each {
            println it
        }
    }

    // Lazy `from {}` defers resolving runtimeClasspath to task execution time,
    // so tasks that don't depend on fetchDependencies (e.g. publishToNexus)
    // don't trigger dependency resolution during Gradle's configuration phase.
    from { sourceSets.main.runtimeClasspath }
    into 'downloads'

    doLast {
        println "fetch dep:"
        ext.frameworkName = { zipFileName ->
            switch(zipFileName) {
                case ~/.*aarch64-osx.*/:
                    return 'graal_builds/osx_arm'
                    break
                case ~/.*x86_64-osx.*/:
                    return 'graal_builds/osx_x86'
                    break
                case ~/.*aarch64-ios.*/:
                    return 'graal_builds/ios'
                    break
                case ~/.*ios-simulator.zip.*/:
                    return 'graal_builds/ios_simulator'
                    break
                default:
                    return 'graal_builds/$zipFileName'
                    break
            }
        }
        fileTree(dir: 'downloads', includes: ['*.zip']).each { zipFile ->
            copy {
                from zipTree(zipFile)
                into frameworkName(zipFile.name)
            }
        }

        new File('downloads').deleteDir()
    }
}

task publishToNexus {
    group = 'publishing'
    description = 'Uploads DXFeedFramework.zip to the qd Nexus/Maven repository'

    def repoUrl = 'https://maven.in.devexperts.com/content/repositories/qd'
    def artifactGroupId = 'com.dxfeed'
    def artifactId = 'DXFeedFramework'
    def artifactVersion = project.findProperty('publishVersion') ?: native_version
    def zipFile = file('build/DXFeedFramework.zip')

    doLast {
        if (!zipFile.exists()) {
            throw new GradleException("Artifact not found: ${zipFile}. Build/archive it before running this task.")
        }

        def username = project.findProperty('nexusUsername') ?: System.getenv('NEXUS_USERNAME')
        def password = project.findProperty('nexusPassword') ?: System.getenv('NEXUS_PASSWORD')
        if (!username || !password) {
            throw new GradleException(
                "Nexus credentials are required: pass -PnexusUsername=... -PnexusPassword=... " +
                "or set NEXUS_USERNAME / NEXUS_PASSWORD env vars."
            )
        }

        def groupPath = artifactGroupId.replace('.', '/')
        def targetUrl = "${repoUrl}/${groupPath}/${artifactId}/${artifactVersion}/${artifactId}-${artifactVersion}.zip"
        logger.lifecycle("Uploading ${zipFile} to ${targetUrl}")

        def connection = new URL(targetUrl).openConnection()
        connection.setRequestMethod('PUT')
        connection.setDoOutput(true)
        connection.setRequestProperty('Content-Type', 'application/zip')
        // Intentionally NOT using setFixedLengthStreamingMode/setChunkedStreamingMode here:
        // in streaming mode the JDK throws HttpRetryException on a 401/407 response instead of
        // returning the response code, because it cannot re-send an already-streamed body.
        // Buffering lets us see the real HTTP status and Nexus's error body when auth fails.
        connection.setRequestProperty('Content-Length', zipFile.length().toString())
        connection.connectTimeout = 30_000
        connection.readTimeout = 120_000

        def auth = "${username}:${password}".bytes.encodeBase64().toString()
        connection.setRequestProperty('Authorization', "Basic ${auth}")

        connection.outputStream.withStream { out ->
            zipFile.withInputStream { input -> out << input }
        }

        def responseCode = connection.responseCode
        if (responseCode in 200..299) {
            logger.lifecycle("Uploaded successfully: ${targetUrl}")
        } else {
            def errorBody = connection.errorStream?.text ?: connection.inputStream?.text ?: ''
            throw new GradleException("Upload failed: HTTP ${responseCode} ${connection.responseMessage}\n${errorBody}")
        }
    }
}

defaultTasks 'fetchDependencies'
